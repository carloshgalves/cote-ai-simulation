name: Canon consolidated V2
on:
  pull_request:
    paths:
      - 'data/canon/consolidated/**'
      - 'tools/validate_canon_consolidated_v2.py'
      - 'tools/rebuild_canon_indexes_v2.py'
      - 'tools/test_canon_y1_v01.py'
      - 'tools/test_canon_y1_v02.py'
      - 'tools/test_canon_y1_v03.py'
      - 'tools/test_legacy_y1_crosswalk.py'
      - 'tools/canon_first_midterm_v1.py'
      - 'tools/test_canon_record_review.py'
      - 'tests/canon/**'
      - '.github/workflows/canon-consolidated-v2.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/validate_canon_consolidated_v2.py
      - run: python tools/rebuild_canon_indexes_v2.py --check
      - run: python tools/test_canon_y1_v01.py
      - run: python tools/test_canon_y1_v02.py
      - run: python tools/test_canon_y1_v03.py
      - run: python tools/test_legacy_y1_crosswalk.py
      - run: python tools/test_canon_record_review.py
      - run: python -m unittest discover -s tests/canon -p 'test_first_midterm_executable_v1.py' -v
