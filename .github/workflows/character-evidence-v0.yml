name: Character Evidence V0 and RAG V2 boundary

on:
  pull_request:
    paths:
      - "data/canon/actors/**"
      - "data/canon/characters/**"
      - "data/canon/evidence/characters/**"
      - "data/canon/schema/character_evidence_*"
      - "tools/character_evidence_v2_bridge.py"
      - "tests/canon/test_character_evidence_v0.py"
      - "tests/canon/test_character_rag_v2_bridge.py"
      - ".github/workflows/character-evidence-v0.yml"
  push:
    branches:
      - feat/character-evidence-packs

permissions:
  contents: read

jobs:
  evidence-and-isolation:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
        hash-seed: ["0", "123"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install "pytest>=8,<10" "jsonschema>=4.21,<5" "PyYAML>=6,<7"
      - name: Validate character packs, conversion boundary, RAG gates and golden evals
        env:
          PYTHONHASHSEED: ${{ matrix.hash-seed }}
        run: python -m pytest tests/canon/test_character_evidence_v0.py tests/canon/test_character_rag_v2_bridge.py tests/canon_rag -q
