name: CSFRV1-10E1 exact authoritative byte-transcript parity
"on":
  pull_request:
    branches: [main]
    paths:
      - "internal/csf/commit/reference_equivalence_e1*"
      - "docs/reference-run/csfrv1-10e1/**"
      - ".github/workflows/csfrv1-10e1-byte-oracle.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: csfrv1-10e1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  e1-real-composite-run:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.2"
          cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13.18"
      - name: Install pinned A1 source dependencies and generate fixture
        run: |
          python -m pip install --disable-pip-version-check --no-input -e '.[dev]' \
            'numpy==2.5.4' 'pydantic==2.14.3' 'PyYAML==6.0.3' \
            'pytest==9.2.0' 'jsonschema==4.26.0' 'hypothesis==6.170.15'
          python -m tests.architecture.emit_go_physical_fixture --out /tmp/physical-go-fixture-e1
          find src/embodiment -type d -name __pycache__ -prune -exec rm -rf {} +
      - name: Diff hygiene and gofmt
        run: |
          set -euo pipefail
          git diff --check HEAD^1 HEAD
          files="$(gofmt -l internal/csf/commit/reference_equivalence_e1*.go)"
          if [ -n "$files" ]; then echo "E1 gofmt: $files"; exit 1; fi
      - name: E1 canonical transcript real A1, owner escrow and corruption negatives
        env:
          PHYSICAL_A1_PRODUCER_TEST: "1"
        run: go test -count=1 -v ./internal/csf/commit -run '^TestReferenceE1'
      - name: Race detector on full E1 equivalence
        env:
          PHYSICAL_A1_PRODUCER_TEST: "1"
        run: go test -race -count=1 ./internal/csf/commit -run '^TestReferenceE1SameSignedSourcesWholeCausalAndOwnerByteTranscript$'
      - name: Integration regressions and vet
        env:
          PHYSICAL_A1_PRODUCER_TEST: "1"
        run: |
          go test -count=1 ./internal/csf/commit -run '^(TestReferenceD3|TestReferenceD2RealTwoEpochsOnSameC4RunID|TestReferenceC4)'
          go test -count=1 ./internal/csf/perception ./internal/csf/contextboundary ./internal/csf/persistence/sqlite
          go vet ./internal/csf/commit ./internal/csf/persistence/sqlite
