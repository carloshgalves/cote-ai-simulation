name: CSFRV1-10E3 owner snapshot and epistemic resume
"on":
  pull_request:
    branches: [main]
    paths:
      - "internal/csf/commit/reference_snapshot_e3*.go"
      - "internal/csf/ownercheckpoint/**"
      - "internal/csf/persistence/sqlite/snapshot_*.go"
      - "docs/reference-run/csfrv1-10e3/**"
      - ".github/workflows/csfrv1-10e3-owner-resume.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: csfrv1-10e3-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  e3-owner-barrier:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.2"
          cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13.18"
      - name: Install pinned A1 integration dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input -e '.[dev]' \
            'numpy==2.5.4' 'pydantic==2.14.3' 'PyYAML==6.0.3' \
            'pytest==9.2.0' 'jsonschema==4.26.0' 'hypothesis==6.170.15'
          python -m tests.architecture.emit_go_physical_fixture --out /tmp/physical-go-fixture-e3
          find src/embodiment -type d -name __pycache__ -prune -exec rm -rf {} +
      - name: Historical RED on genuine C4 same-revision frozen fence
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/e3-red ccf8c692d9b5c74860fdf7b6e4a37af220f22113
          set +e
          (cd /tmp/e3-red && go test -count=1 -v ./internal/csf/commit -run '^TestReferenceE3SameRevisionFrozenFenceRevokesBothOwners$') >/tmp/e3-red.log 2>&1
          status=$?
          set -e
          if [ "$status" -eq 0 ] || ! grep -q 'E3 barrier: already acknowledged owner' /tmp/e3-red.log; then
            cat /tmp/e3-red.log; exit 1
          fi
          echo 'RED reproduced actual prior owner authorization bypass'
          git worktree remove --force /tmp/e3-red
      - name: E3 exact owner transcripts, pending perception and physical integration
        env:
          PHYSICAL_A1_PRODUCER_TEST: "1"
        run: |
          go test -count=1 -v ./internal/csf/commit -run '^TestReferenceE3'
          go test -count=1 -v ./internal/csf/ownercheckpoint/... -run '^(TestE3|TestOwner58)'
      - name: Race detector on cognitive ACK and integrated cold restore
        run: |
          go test -race -count=1 ./internal/csf/ownercheckpoint/...
          go test -race -count=1 ./internal/csf/commit -run '^(TestReferenceE3C4JointOwnerReopenByteExactAndNegativeReceipts|TestReferenceE3SameRevisionFrozenFenceRevokesBothOwners)$'
      - name: Snapshot resume and physical regression
        env:
          PHYSICAL_A1_PRODUCER_TEST: "1"
        run: |
          go test -count=1 ./internal/csf/commit -run '^(TestCSFRV18|TestReferenceC2|TestReferenceC4|TestReferenceD3RealPythonPrivateEventAndLiveObservatory|TestReferenceE2PreFenceReopenAndAdmitSameSignedSource)'
          go test -count=1 ./internal/csf/persistence/sqlite ./internal/csf/contextboundary ./internal/csf/perception
          go vet ./internal/csf/commit ./internal/csf/ownercheckpoint/... ./internal/csf/persistence/sqlite
          git diff --check origin/main...HEAD
          files="$(gofmt -l internal/csf/commit/reference_snapshot_e3*.go internal/csf/ownercheckpoint/gate.go internal/csf/ownercheckpoint/gate_test.go internal/csf/ownercheckpoint/gate_e3_test.go internal/csf/ownercheckpoint/localdemo/host.go)"
          if [ -n "$files" ]; then echo "E3 unformatted: $files"; gofmt -d $files; exit 1; fi
