name: CSFRV1-10E4 closed reference fork
"on":
  pull_request:
    branches: [main]
    paths:
      - "internal/csf/commit/reference_fork_e4*.go"
      - "internal/csf/persistence/sqlite/fork_*.go"
      - "internal/csf/persistence/sqlite/snapshot_resume.go"
      - ".github/workflows/csfrv1-10e4-closed-fork.yml"
      - "docs/reference-run/csfrv1-10e4/**"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: csfrv1-10e4-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  e4-closed-fork:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.2"
          cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13.18"
      - name: Install pinned A1 integration dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input -e '.[dev]' \
            'numpy==2.5.4' 'pydantic==2.14.3' 'PyYAML==6.0.3' \
            'pytest==9.2.0' 'jsonschema==4.26.0' 'hypothesis==6.170.15'
          python -m tests.architecture.emit_go_physical_fixture --out /tmp/physical-go-fixture-e4
          find src/embodiment -type d -name __pycache__ -prune -exec rm -rf {} +
      - name: Historical RED (unsealed same-revision input)
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/e4-red b4ca52efa0ef351e7b3b3cf795429c8249ee26e1
          trap 'git worktree remove --force /tmp/e4-red' EXIT
          set +e
          (cd /tmp/e4-red && go test -count=1 -v ./internal/csf/commit -run '^TestReferenceE4SameRevisionUnsealedResponseDenied$') >/tmp/e4-red.log 2>&1
          status=$?
          set -e
          cat /tmp/e4-red.log
          test "$status" -ne 0
          grep -F 'E4 accepted a stale cut after an unsealed same-revision response' /tmp/e4-red.log
          grep -F -- '--- FAIL: TestReferenceE4SameRevisionUnsealedResponseDenied' /tmp/e4-red.log
      - name: Integrated C4 fork and D3 fail-closed boundary
        env:
          PHYSICAL_A1_PRODUCER_TEST: "1"
        run: |
          set -euo pipefail
          go test -count=1 -v ./internal/csf/commit -run '^TestReferenceE4' | tee /tmp/e4.log
          for test in TestReferenceE4C4TwoChildrenAndIndependentTails TestReferenceE4RejectFrozenTipWrongPolicyAndCorruptSnapshot TestReferenceE4D3RejectUnfinishedSourceAndUnsupportedPhysicalFork TestReferenceE4SameRevisionUnsealedResponseDenied; do
            grep -F -- "--- PASS: $test " /tmp/e4.log
          done
          if grep -F -- '--- SKIP: TestReferenceE4' /tmp/e4.log; then exit 1; fi
      - name: Race and regression
        env:
          PHYSICAL_A1_PRODUCER_TEST: "1"
        run: |
          go test -race -count=1 ./internal/csf/commit -run '^(TestReferenceE4|TestCSFRV18R58B3ForkChild)'
          go test -count=1 ./internal/csf/commit -run '^(TestCSFRV18|TestReferenceE3|TestReferenceD3RealPythonPrivateEventAndLiveObservatory)'
          go test -count=1 ./internal/csf/persistence/sqlite ./internal/csf/ownercheckpoint/...
          go vet ./internal/csf/commit ./internal/csf/persistence/sqlite
          git diff --check 6ac3ec0348f4a54ebbf97db95bcd3ac983a4e007...HEAD
          files="$(gofmt -l internal/csf/commit/reference_fork_e4*.go)"
          if [ -n "$files" ]; then gofmt -d $files; exit 1; fi
