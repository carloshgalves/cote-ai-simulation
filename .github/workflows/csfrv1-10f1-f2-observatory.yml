name: CSFRV1-10F1-F2 integrated Observatory provenance and diagnostics
"on":
  pull_request:
    branches: [main]
    paths:
      - "internal/csf/observatory/**"
      - "internal/csf/persistence/sqlite/observatory_*.go"
      - "internal/csf/commit/reference_observatory_f*.go"
      - "internal/csf/commit/reference_run.go"
      - "internal/csf/commit/reference_abort_retry_c3.go"
      - "docs/reference-run/csfrv1-10f*/**"
      - ".github/workflows/csfrv1-10f1-f2-observatory.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: csfrv1-10f1-f2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  integrated-observatory:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PHYSICAL_A1_PRODUCER_TEST: "1"
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.2"
          cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13.18"
      - name: Pinned real A1 supervisor
        run: |
          python -m pip install --disable-pip-version-check --no-input -e '.[dev]' \
            'numpy==2.5.4' 'pydantic==2.14.3' 'PyYAML==6.0.3' \
            'pytest==9.2.0' 'jsonschema==4.26.0' 'hypothesis==6.170.15'
          python -m tests.architecture.emit_go_physical_fixture --out /tmp/physical-go-fixture-f
          find src/embodiment -type d -name __pycache__ -prune -exec rm -rf {} +
      - name: SHA and whitespace
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git diff --check cb8459e7921f8ae6ef78b0febdbc9739a515aebb...HEAD
      - name: F1 and F2 integrated normal and inventory
        run: |
          set -euo pipefail
          go test -json -count=1 -timeout=10m ./internal/csf/commit -run '^TestReferenceF[12]' | tee /tmp/f-normal.jsonl
          python docs/reference-run/csfrv1-10f1-f2/verify_tests.py /tmp/f-normal.jsonl
      - name: F1 and F2 integrated race and inventory
        run: |
          set -euo pipefail
          go test -race -json -count=1 -timeout=15m ./internal/csf/commit -run '^TestReferenceF[12]' | tee /tmp/f-race.jsonl
          python docs/reference-run/csfrv1-10f1-f2/verify_tests.py /tmp/f-race.jsonl
      - name: O1-O4 D3 and architectural regressions
        run: |
          go test -count=1 -timeout=10m ./internal/csf/commit -run '^(TestCSFRV19O[1-4]|TestReferenceD3)'
          go test -count=1 ./internal/csf/observatory ./internal/csf/persistence/sqlite ./internal/csf/contextboundary ./internal/csf/perception ./tests/architecture
          go vet ./internal/csf/observatory ./internal/csf/persistence/sqlite ./internal/csf/commit
