name: CSFRV1-10G1 executable normative evidence registry
"on":
  pull_request:
    branches: [main]
    paths:
      - "internal/**"
      - "src/**"
      - "tests/**"
      - "docs/adr/0008-causal-simulation-foundation-v1.md"
      - "docs/reference-run/csfrv1-10a/**"
      - "docs/reference-run/csfrv1-10g/**"
      - ".github/workflows/csfrv1-10g-evals.yml"
      - "go.mod"
      - "go.sum"
      - "pyproject.toml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: csfrv1-10g-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PHYSICAL_A1_PRODUCER_TEST: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.2"
          cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13.18"
      - name: Pinned real A1 supervisor
        run: |
          python -m pip install --disable-pip-version-check --no-input -e '.[dev]' \
            'numpy==2.5.4' 'pydantic==2.14.3' 'PyYAML==6.0.3' \
            'pytest==9.2.0' 'jsonschema==4.26.0' 'hypothesis==6.170.15'
          python -m tests.architecture.emit_go_physical_fixture --out /tmp/physical-go-fixture-g
          find src/embodiment -type d -name __pycache__ -prune -exec rm -rf {} +
      - name: Exact SHA and registry negative controls
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git diff --check 902ff115b5008b6d33dec314eeb4a9a5c805412e...HEAD
          test -z "$(gofmt -l internal/csf/commit/reference_eval_g1_test.go)"
          python -B docs/reference-run/csfrv1-10g/test_run_evals.py
      - name: Execute all registered witnesses normal and race
        run: |
          python -B docs/reference-run/csfrv1-10g/run_evals.py --sha "$SOURCE_SHA" --out "$RUNNER_TEMP/csf-g-evidence"
      - name: Publish digest-only matrix even on test failure
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: csfrv1-10g-evidence-${{ env.SOURCE_SHA }}
          path: ${{ runner.temp }}/csf-g-evidence/evidence.json
          if-no-files-found: error
          retention-days: 90
