name: CSFRV1-10G executable normative evidence registry
"on":
  pull_request:
    branches: [main]
    paths:
      - "internal/**"
      - "src/**"
      - "tests/**"
      - "docs/adr/0008-causal-simulation-foundation-v1.md"
      - "docs/reference-run/csfrv1-10a/**"
      - "docs/reference-run/csfrv1-10g/**"
      - ".github/workflows/csfrv1-10g-evals.yml"
      - "go.mod"
      - "go.sum"
      - "pyproject.toml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: csfrv1-10g-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PHYSICAL_A1_PRODUCER_TEST: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.2"
          cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13.18"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Pinned real A1 supervisor
        run: |
          python -m pip install --disable-pip-version-check --no-input -e '.[dev]' \
            'numpy==2.5.4' 'pydantic==2.14.3' 'PyYAML==6.0.3' \
            'pytest==9.2.0' 'jsonschema==4.26.0' 'hypothesis==6.170.15'
          python -m tests.architecture.emit_go_physical_fixture --out /tmp/physical-go-fixture-g
          find src/embodiment -type d -name __pycache__ -prune -exec rm -rf {} +
      - name: Exact SHA and registry negative controls
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git diff --check 902ff115b5008b6d33dec314eeb4a9a5c805412e...HEAD
          files=(internal/csf/commit/reference_eval_g1_test.go internal/csf/commit/reference_eval_g2_test.go internal/csf/admission/reference_eval_g2_test.go internal/csf/decision/workers.go internal/csf/decision/workers_test.go internal/csf/commit/reference_eval_g3_parallel_test.go internal/csf/commit/reference_eval_g3_control_test.go internal/csf/commit/reference_eval_g4_test.go internal/csf/commit/reference_eval_g5_test.go internal/csf/contextboundary/g5_adversarial_test.go internal/csf/commit/reference_order.go)
          if [ -n "$(gofmt -l "${files[@]}")" ]; then
            gofmt -d "${files[@]}"
            exit 1
          fi
          python -B docs/reference-run/csfrv1-10g/test_run_evals.py
          python -B docs/reference-run/csfrv1-10g/test_g6_finalize.py
      - name: G2 real focused controls (synthetic fixtures)
        run: |
          go test -count=1 -timeout=5m ./internal/csf/commit ./internal/csf/admission -run '^TestReferenceG2'
      - name: G3 real focused controls and worker purity
        run: |
          go test -count=1 -timeout=5m ./internal/csf/decision -run '^TestG3'
          go test -race -count=1 -timeout=5m ./internal/csf/decision -run '^TestG3'
          go test -count=1 -timeout=5m ./internal/csf/commit -run '^TestReferenceG3(RetryFence|FrozenAdvance|OrdinalGap)'
          go test -count=1 -timeout=5m ./tests/architecture -run '^TestResourceDecisionBoundary'
      - name: G4 authenticated A1/Go integration and negative controls
        run: |
          PHYSICAL_A1_PRODUCER_TEST=1 go test -count=1 -timeout=15m ./internal/csf/commit -run '^TestReferenceG4'
          PHYSICAL_A1_PRODUCER_TEST=1 go test -race -count=1 -timeout=15m ./internal/csf/commit -run '^TestReferenceG4'
      - name: G5 real POV-to-context and coherent security mutants
        run: |
          go test -count=1 -timeout=15m ./internal/csf/contextboundary -run '^TestKnowledgeBoundaryG5'
          go test -race -count=1 -timeout=15m ./internal/csf/contextboundary -run '^TestKnowledgeBoundaryG5'
          PHYSICAL_A1_PRODUCER_TEST=1 go test -count=1 -timeout=15m ./internal/csf/commit -run '^TestReferenceG5'
          PHYSICAL_A1_PRODUCER_TEST=1 go test -race -count=1 -timeout=15m ./internal/csf/commit -run '^TestReferenceG5'
      - name: Execute all registered witnesses normal and race
        run: |
          python -B docs/reference-run/csfrv1-10g/run_evals.py --sha "$SOURCE_SHA" --out "$RUNNER_TEMP/csf-g-evidence"
      - name: G6 independent 621-case Go/TS V1 conformance and final NO-GO disposition
        run: |
          go run ./cmd/csf-harness \
            --bundle docs/architecture/canonical-codec-v1-bundle \
            --report "$RUNNER_TEMP/csf-g-evidence/g6-go-v1-report.json"
          node --no-warnings --experimental-loader ./tools/csf-conformance-ts/loader.mjs \
            tools/csf-conformance-ts/runner.ts \
            docs/architecture/canonical-codec-v1-bundle \
            "$RUNNER_TEMP/csf-g-evidence/g6-ts-v1-report.json"
          cmp "$RUNNER_TEMP/csf-g-evidence/g6-go-v1-report.json" \
              "$RUNNER_TEMP/csf-g-evidence/g6-ts-v1-report.json"
          export G6_NODE_VERSION="$(node --version)"
          python -B docs/reference-run/csfrv1-10g/g6_finalize.py \
            --sha "$SOURCE_SHA" \
            --evidence "$RUNNER_TEMP/csf-g-evidence/evidence.json" \
            --go-report "$RUNNER_TEMP/csf-g-evidence/g6-go-v1-report.json" \
            --ts-report "$RUNNER_TEMP/csf-g-evidence/g6-ts-v1-report.json" \
            --out "$RUNNER_TEMP/csf-g-evidence"
      - name: Publish digest-only matrix even on test failure
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: csfrv1-10g-evidence-${{ env.SOURCE_SHA }}
          path: |
            ${{ runner.temp }}/csf-g-evidence/evidence.json
            ${{ runner.temp }}/csf-g-evidence/g6-decision.json
            ${{ runner.temp }}/csf-g-evidence/g6-gaps.json
          if-no-files-found: error
          retention-days: 90
