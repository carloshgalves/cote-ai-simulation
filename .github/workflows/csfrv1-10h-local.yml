name: CSFRV1-10H private local reference run and detached replay
"on":
  pull_request:
    branches: [main]
    paths:
      - "cmd/csf-reference-run-local/**"
      - "internal/csf/**"
      - "internal/physicalhost/**"
      - "src/embodiment/**"
      - "docs/reference-run/csfrv1-10h/**"
      - ".github/workflows/csfrv1-10h-local.yml"
      - "go.mod"
      - "go.sum"
      - "pyproject.toml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: csfrv1-10h-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  private-local:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.2"
          cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13.18"
      - name: Pinned real Python A1 runtime and private fixture
        run: |
          python -m pip install --disable-pip-version-check --no-input -e '.[dev]' \
            'numpy==2.5.4' 'pydantic==2.14.3' 'PyYAML==6.0.3' \
            'pytest==9.2.0' 'jsonschema==4.26.0' 'hypothesis==6.170.15'
          python -m tests.architecture.emit_go_physical_fixture --out /tmp/physical-go-fixture-h
          find src/embodiment -type d -name __pycache__ -prune -exec rm -rf {} +
      - name: Unit, race and negative controls
        run: |
          set -euo pipefail
          git diff --check
          files=(cmd/csf-reference-run-local/main_linux.go cmd/csf-reference-run-local/verify_linux.go cmd/csf-reference-run-local/main_linux_test.go
            cmd/csf-reference-run-local/h2_ledgers_linux.go cmd/csf-reference-run-local/h2_ledgers_linux_test.go
            cmd/csf-reference-run-local/h2_owner_linux.go cmd/csf-reference-run-local/h2_integrated_mutants_linux_test.go
            cmd/csf-reference-run-local/h2_ingress_linux.go cmd/csf-reference-run-local/h2_raw_source_linux.go
            cmd/csf-reference-run-local/h2_replay_linux.go cmd/csf-reference-run-local/h2_replay_compare_linux.go
            cmd/csf-reference-run-local/h2_replay_compare_linux_test.go
            cmd/csf-reference-run-local/h2_wal_preflight_linux.go
            cmd/csf-reference-run-local/h2_wal_preflight_linux_test.go
            cmd/csf-reference-run-local/runbook_linux.go
            cmd/csf-reference-run-local/runbook_linux_test.go
            internal/csf/runbook/outcome.go internal/csf/runbook/outcome_test.go
            internal/csf/commit/reference_h2_runbook_linux_test.go
            internal/csf/commit/reference_d3_offline_same_a1_linux.go
            internal/csf/commit/reference_d3_offline_same_a1_linux_test.go
            internal/csf/commit/reference_physical_d2.go
            internal/csf/commit/reference_crash_e2_integrated_test.go
            internal/csf/commit/reference_h2_archived_recovery_linux_test.go
            internal/csf/commit/reference_h2_archived_barrier_linux_test.go
            internal/physicalhost/supervisor_linux.go internal/physicalhost/private_capture_linux.go
            internal/physicalhost/private_capture_linux_test.go)
          if [ -n "$(gofmt -l "${files[@]}")" ]; then
            gofmt -d "${files[@]}"
            exit 1
          fi
          go test -count=1 -timeout=10m ./cmd/csf-reference-run-local ./internal/physicalhost
          go test -count=1 -timeout=10m -run '^TestH2IndependentD3Replay' ./internal/csf/commit
          go test -race -count=1 -timeout=10m ./cmd/csf-reference-run-local ./internal/physicalhost
          go test -race -count=1 -timeout=10m -run '^TestH2IndependentD3Replay' ./internal/csf/commit
          go test -count=1 ./internal/csf/runbook
          go test -race -count=1 ./internal/csf/runbook
          go vet ./cmd/csf-reference-run-local ./internal/physicalhost ./internal/csf/commit ./internal/csf/runbook
      - name: H2-F same-A1 real crash and pending-barrier fault matrix
        env:
          PHYSICAL_A1_PRODUCER_TEST: "1"
          CSF_E2_EVIDENCE_PATH: ${{ runner.temp }}/h2-f-exact-head-e2.json
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          test ! -e "$CSF_E2_EVIDENCE_PATH"
          # Reuse two original supervised signed A1 sources; no resampling.
          go test -v -count=1 -timeout=25m -run '^TestReferenceE2IntegratedC4D3CrashResumeByteExactAfterBothEpochs$' ./internal/csf/commit
          python - <<'PY'
          import json, os
          with open(os.environ["CSF_E2_EVIDENCE_PATH"], encoding="utf-8") as fp:
              report = json.load(fp)
          assert report["Status"] == "E2_LOCAL_C4_D3_RECOVERY_BYTES_EQUAL"
          assert report["Reference"] == "CSFRV1-10/E2 #141"
          assert report["VerifiedBaselineCommits"] == 9
          assert report["AuthenticatedA1Cuts"] == 2
          assert report["IndependentCrashResumeCases"] == 14
          assert report["PhysicalSQLRollbackSteps"] == 7
          assert report["SignerReexecution"] is False
          assert len(report["CanonicalManifest"]) > 0
          print("H2_F_2x7_RESTART_MATRIX=14_OF_14_SAME_SIGNED_A1")
          PY
          go test -count=1 -timeout=25m -run '^TestReferenceE2(PreFenceReopenAndAdmitSameSignedSource|SevenPhysicalAtomicFaultsNewProcessRecovery|RecoveredCutCannotCreateNewSourceOrCrossRun|CorruptSavedIngressRefusesRecoveryBeforeCommit)$' ./internal/csf/commit
          go test -count=1 -timeout=15m -run '^TestCSFRV18(RehydrateFrozenFenceInsteadOfReselectingCoordinate|PartialPerceptionBeforeCrashResumesWithoutDuplicateReceipt|HaltedNeverAutoResumesOnReconnect|ResumeDrainsCausallyCommittedPerceptionExactlyOnce)$' ./internal/csf/commit
          echo 'H2_F_PREFENCE_SOURCE_RETRY=IDEMPOTENT'
          echo 'H2_F_CRASH_RESTART_CHILD=EXACT_TERMINAL_NO_DUPLICATES'
          echo 'H2_F_PENDING_PERCEPTION_BARRIER=FROZEN_AND_RESUMED_ONCE'
          echo 'H2_F_RELEASE=NO_GO'
          # No upload of raw cuts, owner stores or private E2 report.
      - name: Real A1+D3 and detached owner, snapshot and ledger semantic mutants
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          out="$RUNNER_TEMP/h-private-${{ github.run_id }}"
          go run ./cmd/csf-reference-run-local --out "$out" | tee "$RUNNER_TEMP/h-summary.txt"
          grep -Fx 'FIRST_REFERENCE_RUN_LOCAL=EXECUTED_AND_CHECKED' "$RUNNER_TEMP/h-summary.txt"
          grep -Fx 'H2_FIVE_CANONICAL_LEDGERS=VERIFIED_PRIVATE' "$RUNNER_TEMP/h-summary.txt"
          grep -Fx 'H2_SIGNED_OWNER_CHECKPOINTS=VERIFIED_PRIVATE' "$RUNNER_TEMP/h-summary.txt"
          grep -Fx 'H2_GENESIS_BOUND_SIGNED_INGRESS=VERIFIED_PRIVATE' "$RUNNER_TEMP/h-summary.txt"
          grep -Fx 'H2_RAW_PYTHON_A1_CUTS=SEALED_AND_VERIFIED_PRIVATE' "$RUNNER_TEMP/h-summary.txt"
          grep -Fx 'H2_SAME_SIGNED_A1_INDEPENDENT_GO_D3=BYTE_IDENTICAL_AUTHORITIES' "$RUNNER_TEMP/h-summary.txt"
          grep -Fx 'CSFRV1_10_V1_DOD_ACCEPTED=NO' "$RUNNER_TEMP/h-summary.txt"
          grep -Fx 'FIRST_REAL_RUN_PRODUCTION_GO=NO' "$RUNNER_TEMP/h-summary.txt"
          go run ./cmd/csf-reference-run-local --verify "$out"
          H2_REAL_PRIVATE_ARCHIVE="$out" go test -v -count=1 -run TestH2RejectsRehashedSemanticCorruption ./cmd/csf-reference-run-local
          if go run ./cmd/csf-reference-run-local --out "$out"; then
            echo "SECURITY ERROR: overwritten local archive"
            exit 1
          fi
          cp -a "$out" "$RUNNER_TEMP/h-tampered"
          printf x >> "$RUNNER_TEMP/h-tampered/owner/actor-b.db"
          if go run ./cmd/csf-reference-run-local --verify "$RUNNER_TEMP/h-tampered"; then
            echo "SECURITY ERROR: altered owner checkpoint accepted"
            exit 1
          fi
          cp -a "$out" "$RUNNER_TEMP/h-tampered-ledger"
          printf x >> "$RUNNER_TEMP/h-tampered-ledger/ledger-export/input_ledger.bin"
          if go run ./cmd/csf-reference-run-local --verify "$RUNNER_TEMP/h-tampered-ledger"; then
            echo "SECURITY ERROR: tampered canonical ledger accepted"
            exit 1
          fi
          cp -a "$out" "$RUNNER_TEMP/h-missing-ledger"
          rm "$RUNNER_TEMP/h-missing-ledger/ledger-export/event_store.bin"
          if go run ./cmd/csf-reference-run-local --verify "$RUNNER_TEMP/h-missing-ledger"; then
            echo "SECURITY ERROR: missing normative ledger accepted"
            exit 1
          fi
          echo 'H_LOCAL_SOURCE=REAL_PYTHON_A1_D3'
          echo 'H2_FIVE_LEDGER_EXPORT=REAL_PRIVATE_REPLAY'
          echo 'H2_TWO_OWNER_SIGNED_RECEIPTS=REAL_PRIVATE_REPLAY'
          echo 'H2_RAW_A1_ARCHIVE=PRIVATE_EXACT_SOURCE_BYTES_TWO_EPOCHS'
          echo 'H2_A1_ARCHIVE_SEALED_COLD_SOURCE=VERIFIED'
          echo 'H2_SAME_SOURCE_TWO_FULL_C4_D2_D3_DATABASES=BYTE_IDENTICAL_ALL_SQLITE_TABLES'
          echo 'H2_SIGNED_SOURCE_RECEIPTS=2_EPOCHS_EIGHT_RECEIPTS_FINAL_CLOSURE'
          echo 'H2_NO_REINGRESS_ON_DURABLE_RECOVERY=VERIFIED'
          echo 'H2_SNAPSHOT_SEAL=VERIFIED_THREE_TAIL_COMMITS'
          echo 'H_MUTANTS=REJECTED'
          echo 'H_RELEASE=NO_GO'
          # Never upload private ledgers, physical source, owner DBs or raw cuts.
      - name: H2-C recovery against the exact existing CLI archive
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          export H2_ARCHIVED_SOURCE="$RUNNER_TEMP/h-private-${{ github.run_id }}"
          export H2_ARCHIVED_SOURCE_REQUIRED=1
          export H2_ARCHIVED_INDEX_SHA256="$(sha256sum "$H2_ARCHIVED_SOURCE/checksums.json" | cut -d ' ' -f 1)"
          # Cold verification binds the complete archive, installed policy,
          # raw signatures and original SQLite authorities before testing.
          go run ./cmd/csf-reference-run-local --verify "$H2_ARCHIVED_SOURCE"
          export H2_ARCHIVED_RECOVERY_REPORT="$RUNNER_TEMP/h2-c-normal.json"
          go test -count=1 -timeout=25m -run '^TestH2ArchivedSourceCrashRecovery$' ./internal/csf/commit
          export H2_ARCHIVED_RECOVERY_REPORT="$RUNNER_TEMP/h2-c-race.json"
          go test -race -count=1 -timeout=35m -run '^TestH2ArchivedSourceCrashRecovery$' ./internal/csf/commit
          cmp "$RUNNER_TEMP/h2-c-normal.json" "$H2_ARCHIVED_RECOVERY_REPORT"
          go run ./cmd/csf-reference-run-local --verify "$H2_ARCHIVED_SOURCE"
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          with open(os.environ["H2_ARCHIVED_RECOVERY_REPORT"], encoding="utf-8") as f:
              proof = json.load(f)
          index = Path(os.environ["H2_ARCHIVED_SOURCE"]) / "checksums.json"
          assert hashlib.sha256(index.read_bytes()).hexdigest() == os.environ["H2_ARCHIVED_INDEX_SHA256"]
          assert proof == {
              "status": "H2_C_ARCHIVED_SOURCE_RECOVERY",
              "archive_index_sha256": hashlib.sha256(index.read_bytes()).hexdigest(),
              "cases": 14,
              "commits": 9,
              "barrier_cases": 1,
          }
          print("H2_C_SAME_CLI_ARCHIVE_RECOVERY=14_OF_14_NORMAL_AND_RACE")
          print("H2_C_SAME_CLI_ARCHIVE_PENDING_BARRIER=WORKER_RESTART_EXACTLY_ONCE_NORMAL_AND_RACE")
          PY
          # Private archive and digest-only reports stay on this runner.
      - name: H2-O real operational cuts and exact process exit codes
        run: |
          set -euo pipefail
          umask 077
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          export H2_ARCHIVED_SOURCE="$RUNNER_TEMP/h-private-${{ github.run_id }}"
          export H2_ARCHIVED_INDEX_SHA256="$(sha256sum "$H2_ARCHIVED_SOURCE/checksums.json" | cut -d ' ' -f 1)"
          export H2_ARCHIVED_SOURCE_REQUIRED=1
          export H2O_RUNBOOK_BINARY="$RUNNER_TEMP/csf-reference-run-local"
          go build -o "$H2O_RUNBOOK_BINARY" ./cmd/csf-reference-run-local
          "$H2O_RUNBOOK_BINARY" --verify "$H2_ARCHIVED_SOURCE"
          go test -count=1 -timeout=15m -run '^TestH2ORunbookRealCuts$' ./internal/csf/commit
          PHYSICAL_A1_PRODUCER_TEST=1 go test -count=1 -timeout=10m -run '^TestReferenceD2(RejectsUnpinnedExecutableAndImportRoot|OpenPhysicalSourcePreventsC4Admission)$' ./internal/csf/commit
          "$H2O_RUNBOOK_BINARY" --verify "$H2_ARCHIVED_SOURCE"
          echo 'H2_O_REAL_CUTS=VERIFIED_EXIT_CODES_NO_WRITE_NO_GO'
          # No private database, source cut, or actor state leaves the runner.
