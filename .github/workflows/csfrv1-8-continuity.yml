name: CSFRV1-8 Continuity Checkpoint
on:
  push:
    branches: [feat/csfrv1-8-replay-snapshot-fork]
  pull_request:
    paths:
      - "internal/csf/**"
      - "tests/failureinjection/**"
      - "tests/properties/**"
      - "evals/simulation/csf-runtime-v1/**"
      - ".github/workflows/csfrv1-8-continuity.yml"
permissions:
  contents: read
# Push and PR events for this topic branch should not spend runner minutes
# running identical full suites. New commits supersede older validations.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  # Transient P3/P4 same-runner cost comparison. Remove after evidence.
  fork-p4-cost:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.2"
          cache: true
      - name: Compare lineage verifier extraction with merged P3
        run: |
          set -euo pipefail
          p4="$(git rev-parse HEAD)"
          for version in P3 P4 P3 P4; do
            if [ "$version" = P3 ]; then
              git checkout --quiet 683f14a666abd364cc07dad890853c602278ca86
            else
              git checkout --quiet "$p4"
            fi
            echo "FORK_P4_VERSION=$version SHA=$(git rev-parse HEAD)"
            go test -count=1 -v ./internal/csf/commit -run '^TestCSFRV18ForkP1GoldenBytes$' | grep -E 'FORK_P1_METRIC|PASS|FAIL'
          done
  continuity:
    runs-on: ubuntu-latest
    # The R21 V1→V2 65-WORK cascade is intentionally exercised under -race;
    # this job must accommodate instrumentation without an unbounded CI run.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.2"
          cache: true
      - name: Check whitespace
        run: |
          git fetch --no-tags --depth=1 origin main
          git diff --check origin/main HEAD
      - name: Snapshot and resume negative tests
        run: go test -count=1 -v ./internal/csf/commit -run '^TestCSFRV18'
      - name: Cross-policy reference and negative vectors
        run: go test -count=1 -v ./internal/csf/fork
      - name: Snapshot and fork race regression
        # Go's default 10m package timeout is insufficient for the 65-WORK
        # cross-policy cascade with race instrumentation (issue #59 tracks cost).
        # Keep the complete TestCSFRV18 race matrix, including the cascade.
        run: go test -race -count=1 -timeout=30m ./internal/csf/commit -run '^TestCSFRV18'
      - name: SQLite replay and terminal regression
        run: go test -count=1 ./internal/csf/persistence/sqlite ./internal/csf/clock ./internal/csf/perception
      - name: Full Go regression
        run: go test -count=1 ./...
