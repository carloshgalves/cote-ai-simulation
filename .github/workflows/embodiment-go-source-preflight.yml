name: Go physical source preflight (NOT CSF commit)

"on":
  pull_request:
    branches: [main, feat/107-physical-command-completion-proof]
    paths:
      - "internal/csf/adapter/embodimentv1/**"
      - "tests/architecture/emit_go_physical_fixture.py"
      - ".github/workflows/embodiment-go-source-preflight.yml"
      - "src/embodiment/**"
      - "tests/architecture/embodiment_a2_transition_reference.py"
      - "docs/architecture/embodiment-causal-adapter-v1/**"
      - "go.mod"
      - "go.sum"
      - "pyproject.toml"

permissions:
  contents: read

concurrency:
  group: go-physical-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  go-physical:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.2"
          cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13.18"
      - name: Install pinned physical fixture deps
        run: |
          python -m pip install --disable-pip-version-check --no-input -e '.[dev]' \
            'numpy==2.5.4' 'pydantic==2.14.3' 'PyYAML==6.0.3' \
            'pytest==9.2.0' 'jsonschema==4.26.0' 'hypothesis==6.170.15'
      - name: Patch and checked SHA
        shell: bash
        run: |
          set -euo pipefail
          git diff --check HEAD^1 HEAD
          git rev-parse HEAD
          echo "PR HEAD: ${{ github.event.pull_request.head.sha }}"
          go version
      - name: Produce actual PSV1-2 and A2 evidence for Go
        run: python -m tests.architecture.emit_go_physical_fixture --out /tmp/physical-go-fixture
      - name: Validate completed physical source in Go without granting commit
        env:
          PHYSICAL_GO_FIXTURE_DIR: /tmp/physical-go-fixture
        run: go test -v -count=1 ./internal/csf/adapter/embodimentv1
      - name: Test full Go runtime regressions
        run: go test ./...
