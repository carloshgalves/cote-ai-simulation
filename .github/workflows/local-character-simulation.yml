name: Local character simulation
on:
  pull_request:
    branches: [main, 'feat/pilot-*', 'feat/observatory-*', 'feat/cote-exam-*', 'perf/pilot-*', 'fix/pilot-*']
    paths:
      - 'internal/pilot/**'
      - 'cmd/cote-local/**'
      - '.github/workflows/local-character-simulation.yml'
      - 'internal/csf/clock/**'
      - 'go.mod'
      - 'go.sum'
      - 'data/canon/runtime/**'
      - 'data/canon/catalog.go'
      - 'data/external-worlds/tomodachi-game/**'
  push:
    branches: ['feat/pilot-v29-class-poll', 'experiment/zodiac-day2']
    paths:
      - 'internal/pilot/**'
      - 'cmd/cote-local/**'
      - 'data/canon/runtime/**'
      - '.github/workflows/local-character-simulation.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: local-character-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.2'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reference exam assertions
        run: |
          if test -f data/canon/runtime/school-settlement.test.mjs; then node data/canon/runtime/school-settlement.test.mjs; fi
          if test -f data/external-worlds/tomodachi-game/runtime/adversarial.mjs; then node data/external-worlds/tomodachi-game/runtime/adversarial.mjs; fi
      - run: go test -count=1 ./internal/pilot ./cmd/cote-local
      - run: go test -race -count=1 ./internal/pilot ./cmd/cote-local
      - run: go build -o "$RUNNER_TEMP/cote-local" ./cmd/cote-local
      - name: Fixed-seed longitudinal autonomy evaluation
        env:
          COTE_AUTONOMY_EVAL: "1"
        run: go test -v -count=1 -timeout=8m ./internal/pilot -run '^TestAutonomyLongitudinalEvaluation$'
      - name: Fixed-seed cost and quality comparison
        env:
          COTE_COST_BENCHMARK: "1"
        run: go test -v -count=1 -timeout=12m ./internal/pilot -run '^TestPilotCostQualityBenchmark$'
      - name: Current V16 longitudinal stack validation
        if: ${{ always() && !cancelled() }}
        env:
          COTE_V16_STACK_EVAL: "1"
        run: go test -v -count=1 -timeout=12m ./internal/pilot -run '^TestV16StackLongitudinal$'
