name: O1 Observatory read-only contract
on:
  pull_request:
    paths:
      - "internal/csf/observatory/**"
      - "internal/csf/persistence/sqlite/observatory_**"
      - "internal/csf/commit/observatory_o1_**"
      - "internal/csf/persistence/sqlite/clock_replay.go"
      - "internal/csf/persistence/sqlite/control_replay.go"
      - "internal/csf/persistence/sqlite/store.go"
      - ".github/workflows/o1-observatory-readonly.yml"
      - "go.mod"
      - "go.sum"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  o1:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.2"
          cache: true
      - name: Verify exact source HEAD
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git rev-parse HEAD
      - name: Stage gofmt outputs and print exact source files for checkpoint
        run: |
          paths=(
            internal/csf/observatory/query.go
            internal/csf/observatory/query_test.go
            internal/csf/persistence/sqlite/observatory_readonly.go
            internal/csf/persistence/sqlite/observatory_readonly_test.go
            internal/csf/commit/observatory_o1_integration_test.go
          )
          keys=(O1_CONTRACT O1_ARCH O1_ADAPTER O1_PAGER O1_INTEGRATION)
          gofmt -w "${paths[@]}"
          for i in "${!paths[@]}"; do
            echo "${keys[i]}_GOFMT_BEGIN"
            base64 -w0 "${paths[i]}"
            echo
            echo "${keys[i]}_GOFMT_END"
          done
      - name: O1 real-run integration and negative scenarios
        run: go test -count=1 -v -timeout=12m ./internal/csf/commit -run '^TestCSFRV19O1'
      - name: O1 SQLite pager guard and architecture checks
        run: go test -count=1 -v -timeout=12m ./internal/csf/persistence/sqlite ./internal/csf/observatory -run '^TestCSFRV19O1'
      - name: O1 race detector on all affected packages
        run: go test -race -count=1 -timeout=14m ./internal/csf/commit ./internal/csf/persistence/sqlite ./internal/csf/observatory -run '^TestCSFRV19O1'
      - name: O1 static analyzer
        run: go vet ./internal/csf/observatory ./internal/csf/persistence/sqlite
