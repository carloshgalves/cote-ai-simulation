name: PSV1-2 physical completion receipts

"on":
  pull_request:
    branches: [main]
    paths:
      - "src/embodiment/**"
      - "tests/embodiment/**"
      - "tests/architecture/embodiment_a2_transition_reference.py"
      - "tests/architecture/test_embodiment_a2_transitions.py"
      - "docs/architecture/physical-command-completion-psv1-2.md"
      - ".github/workflows/physical-command-completion.yml"
      - "data/models/physical/**"
      - "pyproject.toml"

permissions:
  contents: read

concurrency:
  group: psv1-2-completion-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  completion:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13.18"
      - name: Install pinned physical test toolchain
        run: |
          python -m pip install --disable-pip-version-check --no-input -e '.[dev]' \
            'numpy==2.5.4' 'pydantic==2.14.3' 'PyYAML==6.0.3' \
            'pytest==9.2.0' 'jsonschema==4.26.0' 'hypothesis==6.170.15'
      - name: Verify patch and commit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check HEAD^1 HEAD
          git rev-parse HEAD
          echo "PR HEAD: ${{ github.event.pull_request.head.sha }}"
          python --version
      - name: Real completion and physical adapter A2 regressions
        run: |
          python -m pytest -q \
            tests/embodiment/test_command_completion.py \
            tests/embodiment/test_continuity.py \
            tests/embodiment/test_cli.py \
            tests/embodiment/test_snapshot.py \
            tests/architecture/test_embodiment_a2_transitions.py
