name: TEMP E1 canonical gofmt
"on":
  push:
    branches: [feat/140-e1-causal-byte-oracle]
permissions:
  contents: write
jobs:
  gofmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.2"
      - name: Format E1 files only
        run: |
          set -euo pipefail
          gofmt -w internal/csf/commit/reference_equivalence_e1*.go
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add internal/csf/commit/reference_equivalence_e1*.go
            git commit -m "style(#140): gofmt E1 transcript oracle and tests"
            git push origin HEAD:feat/140-e1-causal-byte-oracle
          fi
