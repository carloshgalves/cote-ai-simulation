name: TEMP E2 final gofmt (remove)
"on":
  push:
    branches: [feat/141-e2-physical-crash-resume]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.2"
      - name: gofmt both E2 test suites, then push
        run: |
          set -euo pipefail
          gofmt -w internal/csf/commit/reference_crash_e2*.go
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add internal/csf/commit/reference_crash_e2*.go
            git commit -m "style(#141): gofmt adversarial E2 test updates"
            git push origin HEAD:feat/141-e2-physical-crash-resume
          fi
