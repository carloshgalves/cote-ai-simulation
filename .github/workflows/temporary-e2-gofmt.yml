name: TEMP E2 gofmt once
"on":
  push:
    branches: [feat/141-e2-physical-crash-resume]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.2"
      - name: Canonical gofmt and one-time push
        run: |
          set -euo pipefail
          gofmt -w internal/csf/adapter/embodimentv1/authorized_source_linux.go \
            internal/csf/commit/work_physical.go \
            internal/csf/commit/resume_physical.go \
            internal/csf/commit/resume_dispatch.go \
            internal/csf/commit/reference_crash_e2*.go
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add internal/csf/adapter/embodimentv1/authorized_source_linux.go \
              internal/csf/commit/work_physical.go \
              internal/csf/commit/resume_physical.go \
              internal/csf/commit/resume_dispatch.go \
              internal/csf/commit/reference_crash_e2*.go
            git commit -m "style(#141): gofmt E2 recovery implementation and tests"
            git push origin HEAD:feat/141-e2-physical-crash-resume
          fi
