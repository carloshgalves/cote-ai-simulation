name: Zodiac VIP V1 specification conformance

on:
  pull_request:
    paths:
      - "data/models/exams/**"
      - "docs/spec/zodiac-vip-exam-v1.md"
      - "tests/exams/**"
      - ".github/workflows/zodiac-exam-spec.yml"
  push:
    branches:
      - feat/first-special-exam

permissions:
  contents: read

jobs:
  spec-contract:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install YAML contract test dependencies
        run: python -m pip install "pytest>=8,<10" "PyYAML>=6,<7"
      - name: Validate Zodiac/VIP declarative spec, fixtures and invariants
        run: python -m pytest tests/exams/test_zodiac_vip_spec_contract.py -q
