  policy: >
    Do not seed plans, rival identities or exam information that arise only later. Later canon can
    evidence pre-existing strategic dispositions but is not memory at school entry.
  future_evidence_rule: FUTURE_EVIDENCE_ONLY constrains style/capability only; later targets such as X remain absent until caused in-simulation.
identity:
  canonical_name: Kakeru Ryūen
  aliases: [Kakeru Ryuen, Ryūen Kakeru]
  class_ref: entity.class.y1-c
