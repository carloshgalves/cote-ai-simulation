  - id: rule.academic.buy-exam-point
    schema_version: 1
    claim_kind: INSTITUTIONAL_RULE
    domain: academic
    statement: >
      A single point can be added to an exam score in exchange for private
      points; one observed transaction cost 100,000 private points. Whether
      this is a general institutional rule or teacher discretion is not settled.
    temporal:
      effective_from:
        mode: HOLDS_BY
        holds_by: {anchor: Y1_M02}
        origin: UNKNOWN
        basis: Observed once, after the first midterms.
    visibility_default: CONCEALED
