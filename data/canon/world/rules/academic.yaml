  - id: rule.academic.protection-point
    schema_version: 1
    claim_kind: INSTITUTIONAL_RULE
    domain: academic
    statement: >
      A protection point grants the right to override an expulsion. Protection
      points cannot be transferred between students.
    temporal:
      effective_from:
        mode: UNKNOWN
        basis: >
          Located in a late first-year volume, where it appears as an exam
          reward. Whether the underlying rule existed earlier and was merely
          unrevealed, or was introduced at that point, is exactly the question
          this model refuses to guess. Not part of the Y1_START snapshot.
    visibility_default: CONCEALED
    provenance:
      epistemic_status: UNVERIFIED
