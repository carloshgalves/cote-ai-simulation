      supports:
        - work: ln.y1.v01
          strength: primary
      discovered_via:
        - tier: 5
          ref: "you-zitsu.fandom.com/wiki/Advanced_Nurturing_High_School"
          retrieved_at: "2026-09-08"
      verified_by: null
      verified_at: null
      continuity: [ln]
      open_questions: [oq.observability.camera-map]
    engine:
      binds_to: observation.surveillance_zones
    notes_ref: docs/canon/temporal-model.md
