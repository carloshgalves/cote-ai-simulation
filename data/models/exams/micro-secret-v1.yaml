# MICRO_SECRET_V1 — smoke test for the integration seam only.
#
# NOT CANON. Not a second special exam implementation. It exists to prove:
# Characters/Policies -> Knowledge -> Communication -> CSF -> Exam Resolver.
#
# Once the Zodiac/VIP integration is stable this fixture may remain only as a
# fast regression test.

schema_version: 1
not_canon: true
model_kind: MICRO_SECRET_INTEGRATION_EXAM
model_version: 0.1.0
status: TEST_FIXTURE
exam_id: synthetic.micro-secret-v1

participants:
  count: 8
  actors: [a1, a2, a3, a4, b1, b2, b3, b4]

groups:
  - id: G1
    members: [a1, a2, a3, a4]
    secret_holder: a3
  - id: G2
    members: [b1, b2, b3, b4]
    secret_holder: b2

knowledge:
  at_disclosure:
    each_actor_receives:
      - own_group_roster
      - own_is_secret_holder_boolean
    forbidden:
      - other_actor_secret_holder_identity

phases:
  - {id: DISCLOSURE, at: T0}
  - {id: COMMUNICATION, from: T1, until: T10}
  - {id: FINAL_WINDOW, from: T10, until: T20}
  - {id: SETTLEMENT, at: T20}

communication:
  owner: CSF
  exam_behavior: >
    The fixture schedules a communication window but defines no message
    semantics. Actors emit Claims/Transmissions through CSF. A claim may be true
    or false and never mutates secret world truth.

action:
  type: SubmitSecretHolderGuess
  fields: [actor_id, group_id, guessed_actor_id, submission_id]
  constraints:
    - actor_must_belong_to_group
    - secret_holder_cannot_submit
    - guessed_actor_must_belong_to_group
    - one_school_received_submission_per_actor
    - only_final_window

resolution:
  first_valid_final_submission:
    correct: GROUP_SUCCESS
    incorrect: GROUP_FAIL
  no_valid_submission_at_settlement: GROUP_FAIL
  simultaneous_submissions:
    reuse_contract: zodiac-vip-v1.simultaneity

economy:
  private_points: NONE
  class_points: NONE

terminality:
  exactly_one_outcome_per_group: true
  global_closed_when_all_groups_terminal: true

required_events:
  - secret.role.assigned
  - knowledge.input.requested
  - claim.transmitted
  - exam.submission.received
  - exam.group.outcome.proposed
  - exam.group.settled

smoke_scenario:
  setup:
    G1:
      secret_holder: a3
      communications:
        - {from: a3, to: a1, claim: "a2 is the secret holder", truth_value_for_audit: false}
        - {from: a2, to: a1, claim: "a3 is the secret holder", truth_value_for_audit: true}
      final_submission: {from: a1, guess: a3}
      expected: GROUP_SUCCESS
    G2:
      secret_holder: b2
      communications:
        - {from: b3, to: b1, claim: "b4 is the secret holder", truth_value_for_audit: false}
      final_submission: {from: b1, guess: b4}
      expected: GROUP_FAIL

assertions:
  - no_actor_context_contains_world_truth_secret_without_disclosure_or_claim
  - claims_do_not_become_world_truth
  - resolver_never_queries_llm
  - same_inputs_same_seed_same_outcomes
  - result_is_independent_of_narrative_quality
