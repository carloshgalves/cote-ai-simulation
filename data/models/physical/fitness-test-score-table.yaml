# 新体力テスト — official item score table, ages 12-19. NOT CANON.
#
# model_kind: UNIT_ANCHORS
# This is a real-world measurement instrument transcribed from its publication,
# not a claim about the work and not a rule of the school. It may never be cited
# as canon, and no record here may appear in provenance.supports of a claim.
#
# Why it is here: it anchors every capacity dimension that the battery covers to
# a physical unit on the right cohort (Japanese, 12-19, by sex), and — because
# 持久走 and 20mシャトルラン are scored on the same 1-10 scale — it doubles as an
# official equating table between two aerobic modalities.
#
# CAUTION, read before using the numbers:
#   1. The item table is age-INVARIANT within 12-19. It is a criterion table, not
#      a percentile table. It does NOT give cohort mean or SD; those live in the
#      annual 体力・運動能力調査 and are still untranscribed. See SOURCING.md (S1).
#   2. The 持久走 distances per sex are NOT stated in the transcribed sheet.
#      1500 m male / 1000 m female is INFERRED from the times, not verified (S3).
#   3. Transcribed from a publisher's redistribution of the 平成11年度 (1999)
#      実施要項, the sheet itself carrying the note 平成11年4月19日訂正. Verify
#      against the Sports Agency's own 実施要項 before treating as authoritative (S4).
#
# Research: docs/research/physical-domain-v1.md §1
# Decision: docs/adr/0006-physical-domain-model.md

schema_version: 1
not_canon: true
model_kind: UNIT_ANCHORS
model_version: 0.1.0-provisional
transcribed_at: 2026-09-08
source:
  instrument: "新体力テスト (New Physical Fitness Test), 12-19 age band"
  publisher_of_battery: "文部省 / スポーツ庁 (Japan Sports Agency)"
  document: "新体力テスト実施要項 — 項目別得点表 および 総合評価基準表 (平成11年度, corrected 1999-04-19)"
  transcribed_from: "https://www.daiichi-g.co.jp/stest/feature/tokuten/xls/sd-2.xls"
  landing_page: "https://www.daiichi-g.co.jp/stest/feature/tokuten/index.html"
  official_landing_page: "https://www.mext.go.jp/sports/b_menu/sports/mcatetop03/list/detail/1408001.htm"
  verification_status: SECONDARY_REDISTRIBUTION_UNVERIFIED

items:
  - id: grip_kg
    item_ja: "握力"
    unit: "kg"
    dimension: max_strength
  - id: situps_reps
    item_ja: "上体起こし"
    unit: "reps_30s"
    dimension: strength_endurance
  - id: sit_reach_cm
    item_ja: "長座体前屈"
    unit: "cm"
    dimension: flexibility
  - id: side_step_pts
    item_ja: "反復横とび"
    unit: "touches_20s"
    dimension: agility
  - id: endurance_run
    item_ja: "持久走"
    unit: "s"
    dimension: aerobic_capacity
    note: "Alternative to shuttle_laps; the student does one or the other. Distances per sex INFERRED, not verified."
  - id: shuttle_laps
    item_ja: "20mシャトルラン"
    unit: "laps"
    dimension: aerobic_capacity
    note: "Alternative to endurance_run. Equal points across the two items is the official equating."
  - id: dash50_s
    item_ja: "50m走"
    unit: "s"
    dimension: sprint_speed
  - id: long_jump_cm
    item_ja: "立ち幅とび"
    unit: "cm"
    dimension: anaerobic_power
  - id: handball_m
    item_ja: "ハンドボール投げ"
    unit: "m"
    dimension: anaerobic_power
    note: "Shares anaerobic_power with long_jump_cm; upper-body throw vs lower-body jump. Treat as two indicators of one dimension, not two dimensions."

# Bands are inclusive. A bound omitted means open-ended in that direction.
