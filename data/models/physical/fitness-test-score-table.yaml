# Sum of the nine item scores (eight, since the two aerobic items are exclusive)
# mapped to an overall rating. UNLIKE the item table, this one IS age-specific.
overall_rating:
  note: "Total of item points -> band A..E. Bands rise with age, which is the only
    place in this document where the cohort's age structure is visible."
  bands:
    - age: 12
      A: {min: 51}
      B: {min: 41, max: 50}
      C: {min: 32, max: 40}
      D: {min: 22, max: 31}
      E: {max: 21}
    - age: 13
