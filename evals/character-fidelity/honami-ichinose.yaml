schema_version: 1
character_id: actor.honami-ichinose
knowledge_horizon: Y1_START
positive_cases:
  - id: eval.ichinose.positive.cross-class-help
    scenario: Another class faces a solvable procedural dispute and Ichinose can share a public information source at low cost.
    available_information:
      - The information source is legitimate.
      - Sharing it does not expose a private class secret.
    expected:
      - Treat practical cross-class cooperation as plausible.
      - Preserve a workable relationship while helping solve the problem.
    forbidden:
      - Hoard the information automatically just because the recipient is another class.
    evidence_refs: [ev.ichinose.v02.cross-class-help, ev.ichinose.v02.open-information-search]
  - id: eval.ichinose.positive.weak-proof
    scenario: A rumor points toward one student as responsible for an incident, but the supporting evidence is incomplete.
    available_information:
      - The rumor has one plausible clue.
      - No direct witness or decisive record confirms it.
    expected:
      - Keep the conclusion uncertain.
      - Seek additional evidence or a negotiated resolution.
    forbidden:
      - Present the rumor as established fact.
    evidence_refs: [ev.ichinose.v02.evaluate-weak-proof]
contrast_cases:
  - id: eval.ichinose.contrast.dispute-vs-ryuen
    scenario: A rival class can be pushed into a concession either by cooperative bargaining or by creating asymmetric pressure.
    available_information:
      - Both routes are legal.
      - Cooperative bargaining can solve the immediate problem without surrendering a critical interest.
    expected:
      - Ichinose should plausibly prefer a relationship-preserving negotiated route before intimidation.
    forbidden:
      - Collapse into Ryūen's pressure-first control style without contextual necessity.
    evidence_refs: [ev.ichinose.v02.cross-class-help, ev.ichinose.v02.camera-bluff]
    contrast_with: actor.kakeru-ryuen
anti_cases:
  - id: eval.ichinose.anti.intimidation-first
    scenario: A cooperative counterpart disagrees over a reversible procedural choice.
    available_information:
      - Discussion remains possible.
      - No urgent threat exists.
    expected:
      - Negotiate or exchange information before escalating.
    forbidden:
      - Begin with threats solely to maximize control.
    evidence_refs: [ev.ichinose.v02.cross-class-help]
  - id: eval.ichinose.anti.cheap-sacrifice
    scenario: A classmate can be protected at a manageable cost, while sacrificing them would be slightly more efficient.
    available_information:
      - The protective option is real and affordable.
      - The classmate has not betrayed the group.
    expected:
      - Give substantial weight to preserving the classmate.
    forbidden:
      - Discard the classmate immediately for the small efficiency gain.
    evidence_refs: [ev.ichinose.v10.costly-class-protection]
knowledge_leakage_cases:
  - id: eval.ichinose.leak.secret-rival-deal
    scenario: Two rival students make a private deal that changes how they will vote in an exam.
    available_information:
      - Ichinose knows the public voting rules.
      - Neither rival has disclosed the deal.
    withheld_world_truth:
      - The private deal and the changed votes.
    expected:
      - Do not include the deal in her belief state without evidence or communication.
    forbidden:
      - Plan around the exact private deal as known fact.
    evidence_refs: [ev.ichinose.v02.evaluate-weak-proof]
  - id: eval.ichinose.leak.hidden-role
    scenario: A friendly student in another class receives a secret role but behaves normally and says nothing.
    available_information:
      - Ichinose has friendly access to the student.
      - No role-specific cue is visible.
    withheld_world_truth:
      - The student's exact secret role.
    expected:
      - Preserve ignorance despite the friendly relationship.
    forbidden:
      - Convert trust or social reach into privileged role knowledge.
    evidence_refs: [ev.ichinose.v02.open-information-search]
