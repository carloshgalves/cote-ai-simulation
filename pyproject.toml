# Embodiment subdomain of the simulation engine.
#
# Python is chosen for THIS SUBDOMAIN ONLY: ADR 0007. Agent Cognition, the
# Examination Engine, the agent framework, the LLM provider, the vector store and
# the UI are all still unchosen, and this file is not a precedent for any of them.
#
# Every dependency below is a dependency OF THE SUBDOMAIN. A dependency that only
# makes sense for agents, RAG or UI arriving here is a sign the data boundary of
# ADR 0007 §3 is being punctured.

[project]
name = "cote-embodiment"
version = "0.1.0"
description = "Embodiment: sampled physical capacity, body state and physical resolution for the COTE simulation engine."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",      # gaussian copula, SIR (PSV1-3)
    "pydantic>=2.6",    # state types with domain invariants
    "pyyaml>=6.0",      # the subdomain's only input format: versioned parameter files
    "jsonschema>=4.21", # header contract of data/models/physical/
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.98",
]

[project.scripts]
embodiment = "embodiment.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/embodiment"]

[tool.pytest.ini_options]
testpaths = ["tests"]
xfail_strict = true          # an xfail that starts passing is a sourcing gap that closed
filterwarnings = ["error"]
